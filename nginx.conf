server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Astro static site: serve real pages, real 404s ----
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
    }

    # ---- Go admin control-plane (proxied to the `admin` service) ----
    location ^~ /admin/ {
        proxy_pass http://admin:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Go admin static files (embedded admin.css) ----
    location ^~ /admin-static/ {
        proxy_pass http://admin:8000;
        proxy_set_header Host $host;
    }

    # ---- Go admin JSON API (projects content) ----
    location ^~ /api/ {
        proxy_pass http://admin:8000;
        proxy_set_header Host $host;
    }

    # ---- Assets are hand-edited (not hashed) — never cache, always fresh ----
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?|webp)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # ---- HTML pages: never cache ----
    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}